name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cam_registry_dev
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: cambodia_registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cam_registry_dev -d cambodia_registry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: cam_registry_dev
      POSTGRES_PASSWORD: ci_test_password
      POSTGRES_DB: cambodia_registry
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dbt-postgres

      - name: Apply schema migrations
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -f sql/01_create_raw_schema.sql
          PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -f sql/02_create_raw_credit.sql
          PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB -f sql/03_registry_unique.sql

      - name: Run pipeline
        run: python main.py

      - name: dbt deps
        working-directory: cambodia_dbt
        run: dbt deps --profiles-dir ..

      - name: dbt build
        working-directory: cambodia_dbt
        run: dbt build --profiles-dir ..